<script id="domain">
'use strict';
/**
 * @typedef {{id:string,name:string,color:string,budget:number}} Person
 * @typedef {{id:string,description:string,amount:number,place:string,buyers:string[],at:string}} Expense
 * @typedef {{id:string,name:string,date:string,currency:string,people:Person[],expenses:Expense[],lastDeleted?:Expense}} Session
 * @typedef {{version:1,activeId:string|null,theme:'light'|'dark'|null,sessions:Session[]}} AppData
 */
const Domain = (() => {
  /** @param {string} value @param {number} digits @returns {number | null} */
  function parseMinor(value, digits) {
    const input = value.trim();
    const pattern = digits === 0 ? /^\d+$/ : new RegExp('^\\d+(?:[.,]\\d{1,' + digits + '})?$');
    if (!pattern.test(input)) return null;
    const [whole, fraction = ''] = input.split(/[.,]/);
    const minor = BigInt(whole + fraction.padEnd(digits, '0'));
    return minor <= BigInt(Number.MAX_SAFE_INTEGER) ? Number(minor) : null;
  }

  /** @param {number} amount @param {string[]} buyers @returns {Map<string,bigint>} */
  function split(amount, buyers) {
    const ids = [...new Set(buyers)].sort();
    if (!ids.length) return new Map();
    const total = BigInt(amount);
    const count = BigInt(ids.length);
    const basic = total / count;
    // Assign leftover minor units in stable buyer order.
    const remainder = total % count;
    return new Map(ids.map((id, index) => [id, basic + (BigInt(index) < remainder ? 1n : 0n)]));
  }

  /** @param {number} budget @param {bigint} spent */
  function budgetStatus(budget, spent) {
    const limit = BigInt(budget);
    const remaining = limit - spent;
    if (limit === 0n && spent === 0n) return {remaining, percent: null, progress: 0, warning: ''};
    const percent = limit === 0n ? null : spent * 100n / limit;
    const warning = spent >= limit ? 'danger' : spent * 5n >= limit * 4n ? 'warn' : '';
    const progress = warning === 'danger' ? 100 : Number(spent * 10000n / limit) / 100;
    return {remaining, percent, progress, warning};
  }

  /** @param {Pick<Session, "people" | "expenses">} session */
  function totals(session) {
    const people = new Map(session.people.map(person => [person.id, 0n]));
    let spent = 0n;
    let budget = 0n;
    for (const person of session.people) budget += BigInt(person.budget);
    for (const expense of session.expenses) {
      spent += BigInt(expense.amount);
      for (const [id, share] of split(expense.amount, expense.buyers)) {
        if (people.has(id)) people.set(id, people.get(id) + share);
      }
    }
    return {spent, budget, people};
  }

  function placeKey(value) {
    return value.trim().replace(/\s+/g, ' ').toLocaleLowerCase('es-CR');
  }

  function currencyDigits(code) {
    return new Intl.NumberFormat('es-CR', {style:'currency', currency:code}).resolvedOptions().maximumFractionDigits;
  }

  function decimalText(amount, digits) {
    const source = String(amount).padStart(digits + 1, '0');
    return digits ? source.slice(0, -digits) + ',' + source.slice(-digits) : source;
  }

  return {parseMinor, split, budgetStatus, totals, placeKey, currencyDigits, decimalText};
})();
</script>
<script id="state">
'use strict';
const Store = (() => {
  const key = 'gasto-claro.v1';
  /** @type {AppData} */
  const empty = {version:1,activeId:null,theme:null,sessions:[]};
  let initialError = false;
  function read() {
    const source = localStorage.getItem(key);
    if (!source) return structuredClone(empty);
    const parsed = JSON.parse(source);
    if (parsed.version !== 1 || !Array.isArray(parsed.sessions)) throw new Error('Datos incompatibles');
    return parsed;
  }
  let data;
  try { data = read(); } catch { data = structuredClone(empty); initialError = true; }

  /** @param {(next: AppData) => void} change */
  async function update(change) {
    function commit() {
      const next = read();
      change(next);
      localStorage.setItem(key, JSON.stringify(next));
      data = next;
    }
    if (location.protocol !== 'file:' && navigator.locks) {
      await navigator.locks.request(key, commit);
    } else {
      commit();
    }
  }

  function active() {
    return data.sessions.find(session => session.id === data.activeId) ?? data.sessions[0];
  }
  /** @param {AppData} snapshot @param {string} id */
  function sessionById(snapshot, id) {
    const session = snapshot.sessions.find(entry => entry.id === id);
    if (!session) throw new Error('La sesión ya no está disponible.');
    return session;
  }

  function refresh() { data = read(); }
  return {key, initialError, update, active, sessionById, refresh, get data() { return data; }};
})();
</script>

function announce(message) {

}
function haptic() { navigator.vibrate?.(12); }

function statusBadge(status) {
  if (!status.warning) return '';
  const text = status.remaining < 0n ? 'Excedido' : status.warning === 'danger' ? 'Al límite' : 'Cerca del límite';
  return `<span class="badge ${status.warning}">${text}</span>`;
}
function personCard(person, spent, currency) {
  const status = Domain.budgetStatus(person.budget,spent);
  const percent = status.percent === null ? 'Sin presupuesto' : formatCount.format(status.percent) + ' % usado';
  return `<button class="person" data-action="person-detail" data-id="${person.id}">
    <div class="person-head">${avatar(person)}<strong>${escape(person.name)}</strong><span class="chevron">${icon('next')}</span></div>
    <div><span class="muted small">Restante</span><div class="balance num ${status.remaining < 0n ? 'over' : ''}">${money(status.remaining,currency)}</div></div>
    <div class="track ${status.warning}" aria-hidden="true"><span style="--progress:${status.progress}%"></span></div>
    <div class="person-meta"><span class="num">${percent}</span>${statusBadge(status)}</div>
  </button>`;
}
function placesOf(session) {
  const groups = new Map();
  for (const expense of sortedExpenses(session.expenses)) {
    const key = Domain.placeKey(expense.place);
    const entry = groups.get(key) ?? {key,name:expense.place || 'Sin lugar',spent:0n,count:0};
    entry.spent += BigInt(expense.amount);
    entry.count++;
    groups.set(key,entry);
  }
  return [...groups.values()].sort((a,b) => a.name.localeCompare(b.name,'es-CR'));
}
function sortedExpenses(expenses) {
  return [...expenses].reverse().sort((a,b) => b.at.localeCompare(a.at));
}
function drawContent(session, summary) {

      ${session.expenses.length > 3 ? action('Ver todos','navigate','quiet','','data-view="activity"') : ''}</div>

        empty('pin','Todavía no hay gastos','Los lugares aparecerán cuando registres una compra.'));

  }

  const place = route.view === 'place' ? placesOf(session).find(entry => entry.key === route.id) : null;
  if (route.view === 'person' && !person) { route = {view:'home'}; draw(); return; }
  const status = person ? Domain.budgetStatus(person.budget,summary.people.get(person.id)) : null;
  const title = person?.name ?? (route.view === 'place' ? place?.name ?? route.name : 'Todos los gastos');
  const stat = (label,value,extra = '') => `<div class="detail-stat"><span class="muted small">${label}</span><strong class="num ${extra}">${money(value,session.currency)}</strong></div>`;
  const overview = person ? stat('Presupuesto',person.budget) + stat('Gastado',summary.people.get(person.id)) +
    stat('Restante',status.remaining,status.remaining < 0n ? 'over' : '') :
    stat('Total',route.view === 'place' ? place?.spent ?? 0n : summary.spent);
  const back = person ? 'home' : 'places';
  content.innerHTML = `<div class="detail-top">
    ${route.view === 'activity' ? '' : '<div>' + action(person ? 'Personas' : 'Lugares','navigate','quiet','back','data-view="' + back + '"') + '</div>'}
    <div class="section-head"><div class="inline">${person ? avatar(person) : ''}<h2 id="view-heading" tabindex="-1">${escape(title)}</h2>${status ? statusBadge(status) : ''}</div>
    ${person ? action('Editar persona','edit-person','quiet','','data-id="' + person.id + '"') : ''}</div>
    <div class="detail-stats">${overview}</div></div>
    <section class="block" aria-label="Movimientos">${filters(session,person)}
    <p class="muted small" id="filtered-total" aria-live="polite"></p><div id="filtered-list" style="margin-top:8px"></div></section>`;
  drawFiltered(session);
}
function filters(session, person) {
  const grouping = person ? placesOf(session).map(place => ['p:' + place.key,place.name]) :
    session.people.map(entry => [entry.id,entry.name]);
  const option = ([value,label]) => `<option value="${escape(value)}" ${filterState.group === value ? 'selected' : ''}>${escape(label)}</option>`;
  return `<div class="filters" role="group" aria-label="Filtrar gastos">
    <label class="field">Buscar<input type="search" id="filter-query" value="${escape(filterState.query)}" placeholder="Descripción o lugar"></label>
    <label class="field">Desde<input type="date" id="filter-from" value="${escape(filterState.from)}"></label>
    <label class="field">Hasta<input type="date" id="filter-to" value="${escape(filterState.to)}"></label>
    <label class="field">${person ? 'Lugar' : 'Persona'}<select id="filter-group"><option value="">${person ? 'Todos' : 'Todas'}</option>${grouping.map(option).join('')}</select></label>
  </div>`;
}
function drawFiltered(session) {
  const personId = route.view === 'person' ? route.id : null;
  const placeId = route.view === 'place' ? route.id : null;
  const {query,from,to,group} = filterState;
  const normalized = Domain.placeKey(query);
  const shown = sortedExpenses(session.expenses).filter(expense => {
    const day = localTime(new Date(expense.at)).slice(0,10);
    const key = Domain.placeKey(expense.place);
    return (!personId || expense.buyers.includes(personId)) && (placeId === null || key === placeId)
      && (!from || day >= from) && (!to || day <= to)
      && (!group || (personId ? 'p:' + key === group : expense.buyers.includes(group)))
      && (!normalized || Domain.placeKey(expense.description + ' ' + (expense.place || 'Sin lugar')).includes(normalized));
  });
  const shareId = personId || group || null;
  const total = shown.reduce((sum,expense) => sum + expenseShare(expense,shareId),0n);
  $('#filtered-total').textContent = shown.length + (shown.length === 1 ? ' gasto' : ' gastos') + ' · ' + money(total,session.currency) +
    (shareId ? ' en participaciones' : '');
  $('#filtered-list').innerHTML = expenseList(session,shown,shareId,true);
}
function expenseShare(expense, shareId) {
  return shareId ? Domain.split(expense.amount,expense.buyers).get(shareId) ?? 0n : BigInt(expense.amount);
}
function expenseList(session, expenses, shareId = null, filtered = false) {
  if (!expenses.length) return filtered ? empty('receipt','Sin gastos para mostrar','Prueba con otros filtros o agrega una compra.') :
    empty('receipt','Todavía no hay gastos','El primer gasto aparecerá aquí.');
  const names = new Map(session.people.map(person => [person.id,person.name]));
  return '<div class="list">' + expenses.map(expense => {
    const at = new Date(expense.at);
    const label = expense.description || expense.place || 'Gasto';
    const buyers = expense.buyers.map(buyer => names.get(buyer)).filter(Boolean).join(', ');
    const place = expense.place && expense.place !== label ? expense.place + ' · ' : '';
    return `<button class="expense" data-action="edit-expense" data-id="${expense.id}">
      <div class="item-main"><span class="icon-box">${icon(expense.buyers.length > 1 ? 'users' : 'receipt')}</span>
      <div><strong>${escape(label)}</strong><div class="item-caption">${escape(place + buyers)}</div>
      <div class="item-caption">${formatDate.format(at)} · ${formatTime.format(at)}</div></div></div>
      <strong class="num item-amount">${money(expenseShare(expense,shareId),session.currency)}</strong></button>`;
  }).join('') + '</div>';
}
function navigate(view, id, name) {
  route = {view,id,name};
  filterState = emptyFilters();
  draw();
  $('#view-heading')?.focus({preventScroll:true});
}
function drawUndo() {
  const undo = Store.active()?.lastDeleted;
  const toast = $('#toast');
  toast.hidden = !undo;
  toast.innerHTML = undo ? '<span>Gasto eliminado</span>' + action('Deshacer','undo','') + iconButton('Cerrar aviso','dismiss-undo','close') : '';
}
function openSheet(title,body,footer,submit,focusSelector) {
  if (!sheet.open) sheetOpener = document.activeElement;
  sheet.innerHTML = `<form><div class="sheet-head"><h2 id="sheet-title">${title}</h2>${iconButton('Cerrar','close','close')}</div>
    <div class="sheet-body">${body}<p class="error" role="alert" hidden></p></div>
    ${footer ? '<div class="sheet-footer">' + footer + '</div>' : ''}</form>`;
  if (!sheet.open) sheet.showModal();
  const form = sheet.querySelector('form');
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (submit) submit(form);
  });
  if (focusSelector) sheet.querySelector(focusSelector)?.focus();
  else sheet.querySelector('button')?.focus();
  return form;
}
function submitButton(label) { return '<button class="btn primary" type="submit">' + label + '</button>'; }
function sheetError(message) {
  const error = sheet.querySelector('.error');
  if (!error) { announce(message); return; }
  error.hidden = false;
  error.textContent = message;
  error.scrollIntoView({block:'nearest'});
}
function formValue(form,key) { return String(new FormData(form).get(key) ?? '').trim(); }
function field(label,name,options = '') {
  return `<label class="field">${label}<input name="${name}" ${options}></label>`;
}
function parseBudget(value,digits) {
  const amount = Domain.parseMinor(value,digits);
  if (amount === null) throw new Error(digits ? 'Usa un presupuesto válido, con hasta ' + digits + ' decimales.' : 'Usa un presupuesto entero válido.');
  return amount;
}
async function commit(change,message = '',after) {
  if (busy) return false;
  busy = true;
  const locked = [...sheet.querySelectorAll('button[type=submit]')];
  locked.forEach(button => {button.disabled = true;});
  try {
    await Store.update(change);
    if (sheet.open) sheet.close();
    if (after) after();
    draw();
    if (message) { announce(message); haptic(); }
    return true;
  } catch (error) {
    const message = error instanceof DOMException ? 'No se pudieron guardar los cambios en este navegador.' : error.message;
    if (sheet.open) sheetError(message);
    else {
      announce(message);
      const toast = $('#toast');
      toast.hidden = false;
      toast.innerHTML = '<span>' + escape(message) + '</span>' + iconButton('Cerrar aviso','hide-toast','close');
    }
    return false;
  } finally {
    busy = false;
    locked.forEach(button => {button.disabled = false;});
  }
}

    ${field('Persona','person','required maxlength="70" autocomplete="off" placeholder="Nombre" aria-label="Nombre de persona ' + index + '"')}
    ${field('Presupuesto','budget','required inputmode="decimal" maxlength="20" placeholder="0" aria-label="Presupuesto de persona ' + index + '"')}

}
function activeRouteReset() { route = {view:'home'}; filterState = emptyFilters(); }
function openNewSession() {
  const options = currencyCodes.map(code => '<option value="' + code + '"></option>').join('');
  let rowIndex = 1;
  const form = openSheet('Nueva sesión',`
    ${field('Nombre de la sesión','name','required maxlength="80" placeholder="Ej. Compras de diciembre"')}
    <div class="field-pair">${field('Fecha','date','type="date" required value="' + today() + '"')}
    ${field('Moneda','currency','required list="currencies" value="CRC" maxlength="3" pattern="[A-Za-z]{3}" autocomplete="off"')}
    <datalist id="currencies">${options}</datalist></div>
    <fieldset><legend class="field-label">Presupuestos individuales</legend><div class="setup-people">${setupRow(rowIndex)}</div></fieldset>
    <div>${action('Otra persona','setup-person','quiet','plus')}</div>`,submitButton('Crear sesión'), form => {
    try {
      const name = formValue(form,'name');
      if (!name) throw new Error('Escribe un nombre para la sesión.');
      const currency = formValue(form,'currency').toUpperCase();
      if (Intl.supportedValuesOf && !Intl.supportedValuesOf('currency').includes(currency)) throw new Error('Usa un código de moneda válido, como CRC o USD.');
      const digits = Domain.currencyDigits(currency);
      const people = [...form.querySelectorAll('.setup-row')].map((row,index) => {
        const personName = row.querySelector('[name=person]').value.trim();
        if (!personName) throw new Error('Completa el nombre de cada persona.');
        return {id:id(),name:personName,color:palette[index % palette.length],budget:parseBudget(row.querySelector('[name=budget]').value,digits)};
      });
      const session = {id:id(),name,date:formValue(form,'date'),currency,people,expenses:[]};
      commit(data => {data.sessions.push(session); data.activeId = session.id;},'Sesión creada',activeRouteReset);
    } catch (error) { sheetError(error.message); }
  },'[name=name]');
  form.querySelector('.setup-row button').disabled = true;
  form.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    const rows = form.querySelector('.setup-people');
    if (button.dataset.action === 'setup-person') {
      rows.insertAdjacentHTML('beforeend',setupRow(++rowIndex));
      rows.lastElementChild.querySelector('input').focus();
    }
    if (button.dataset.action === 'drop-setup-person' && rows.children.length > 1) {
      button.closest('.setup-row').remove();
      rows.lastElementChild.querySelector('input').focus();
    }
    for (const control of rows.querySelectorAll('button')) control.disabled = rows.children.length < 2;
  });
}

    ${field('Nombre','name','required maxlength="70" value="' + escape(person?.name) + '"')}

          if (index === -1) current.expenses.push(updated);
          else current.expenses[index] = updated;
        },expense ? 'Gasto actualizado' : 'Gasto guardado');
      } catch (error) { sheetError(error.message); }
    },'[name=amount]');
  const amountInput = form.elements.namedItem('amount');
  if (expense) amountInput.select();

  function drawShares() {
    const line = form.querySelector('#shares');
    const amount = Domain.parseMinor(amountInput.value,digits);
    if (selected.size < 2) {line.textContent = ''; return;}
    if (!amount) {line.textContent = 'El monto se reparte entre ' + selected.size + ' personas.'; return;}
    const shares = Domain.split(amount,[...selected]);
    line.textContent = session.people.filter(person => selected.has(person.id))
      .map(person => person.name + ' ' + money(shares.get(person.id),session.currency)).join(' · ');
  }
  drawShares();
  amountInput.addEventListener('input',drawShares);
  form.elements.namedItem('at').addEventListener('input',() => {customDate = true;});
  form.addEventListener('click',event => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    if (button.dataset.action === 'buyer') {
      const buyerId = button.dataset.id;
      if (selected.has(buyerId)) selected.delete(buyerId);
      else selected.add(buyerId);
      button.setAttribute('aria-pressed',String(selected.has(buyerId)));
      drawShares();
    }
    if (button.dataset.action === 'suggest-place') form.elements.namedItem('place').value = button.dataset.place;
  });
}
function currencySymbol(currency) {
  return new Intl.NumberFormat('es-CR',{style:'currency',currency,currencyDisplay:'narrowSymbol'})
    .formatToParts(0).find(part => part.type === 'currency').value;
}
document.addEventListener('click', event => {
  const button = event.target.closest('button[data-action]');
  if (!button || busy) return;
  const session = Store.active();
  const {action:command,id:target,view} = button.dataset;
  switch (command) {
    case 'close': sheet.close(); break;
    case 'theme': {
      const mode = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      commit(data => {data.theme = mode;}, mode === 'dark' ? 'Modo oscuro activado' : 'Modo claro activado');
      break;
    }
    case 'navigate': navigate(view); break;
    case 'new-session': openNewSession(); break;
    case 'sessions': openSessions(); break;
    case 'edit-session': openEditSession(session); break;
    case 'use-session':
      commit(data => {data.activeId = Store.sessionById(data,target).id;},'Sesión abierta',activeRouteReset);
      break;
    case 'add-person': openPerson(session); break;
    case 'edit-person': openPerson(session,session.people.find(person => person.id === target)); break;
    case 'person-detail': navigate('person',target); break;
    case 'place-detail': navigate('place',target,button.querySelector('strong').textContent); break;
    case 'add-expense': openExpense(session); break;
    case 'edit-expense': {
      const expense = session.expenses.find(entry => entry.id === target);
      if (expense) openExpense(session,expense);
      break;
    }
    case 'delete-expense':
      commit(data => {
        const current = Store.sessionById(data,session.id);
        const index = current.expenses.findIndex(entry => entry.id === target);
        if (index < 0) throw new Error('El gasto ya se eliminó.');
        [current.lastDeleted] = current.expenses.splice(index,1);
      },'Gasto eliminado. Puedes deshacerlo.');
      break;
    case 'undo': case 'dismiss-undo':
      commit(data => {
        const current = Store.sessionById(data,session.id);
        if (!current.lastDeleted || current.lastDeleted.id !== session.lastDeleted?.id) throw new Error('El aviso cambió en otra pestaña.');
        if (command === 'undo') current.expenses.push(current.lastDeleted);
        delete current.lastDeleted;
      },command === 'undo' ? 'Gasto restaurado' : '');
      break;
    case 'hide-toast': drawUndo(); break;
  }
});
app.addEventListener('input',event => {
  const field = {'filter-query':'query','filter-from':'from','filter-to':'to','filter-group':'group'}[event.target.id];
  if (field && Store.active()) {
    filterState[field] = event.target.value;
    drawFiltered(Store.active());
  }
});
sheet.addEventListener('close', () => {
  if (!sheet.open) restoreFocus(sheetOpener);
});
function restoreFocus(opener) {
  if (!opener) return;
  if (opener.isConnected) {opener.focus({preventScroll:true}); return;}
  const {action:command,id:target} = opener.dataset;
  const replacement = [...document.querySelectorAll('[data-action]')].find(button =>
    button.dataset.action === command && button.dataset.id === target);
  (replacement ?? $('#view-heading') ?? $('#session-title'))?.focus({preventScroll:true});
}
$('#brand-icon').innerHTML = icon('logo');
systemTheme.addEventListener('change',drawTheme);
addEventListener('storage', event => {
  if (event.key !== Store.key && event.key !== null) return;
  try { Store.refresh(); activeRouteReset(); draw(); }
  catch { announce('No se pudieron leer los datos locales.'); }
});
draw();
if (Store.initialError) {
  $('#toast').hidden = false;
  $('#toast').innerHTML = '<span>No se pudo leer el almacenamiento local.</span>' + iconButton('Cerrar aviso','hide-toast','close');
}

function attachManifest() {
  const image = document.createElement('canvas');
  const context = image.getContext('2d');
  if (!context) return;
  const manifestIcons = [192,512].map(size => {
    image.width = image.height = size;
    context.scale(size / 192,size / 192);
    context.fillStyle = '#334cce';
    context.fillRect(0,0,192,192);
    context.strokeStyle = '#fff';
    context.lineWidth = 7;
    context.lineCap = 'round';
    context.beginPath();
    context.roundRect(42,57,108,78,16);
    context.moveTo(42,82);
    context.lineTo(150,82);
    context.moveTo(62,109);
    context.lineTo(86,109);
    context.moveTo(116,109);
    context.lineTo(129,109);
    context.stroke();
    return {src:image.toDataURL(),sizes:size + 'x' + size,type:'image/png'};
  });
  function link(rel, href) {
    const element = document.createElement('link');
    element.rel = rel;
    element.href = href;
    document.head.append(element);
  }
  link('apple-touch-icon',manifestIcons[0].src);
  link('icon',manifestIcons[0].src);
  if (/^https?:$/.test(location.protocol)) {
    const start = new URL(location.href);
    start.search = start.hash = '';
    const manifest = {id:start.href,name:'Gasto Claro',short_name:'Gasto Claro',lang:'es-CR',
      start_url:start.href,scope:new URL('.',start).href,display:'standalone',
      theme_color:'#f5f6fa',background_color:'#f5f6fa',icons:manifestIcons};
    link('manifest','data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
  }
}
if (typeof CanvasRenderingContext2D.prototype.roundRect === 'function') attachManifest();
</script>
<script id="unit-tests">
'use strict';
/* Open the file with ?tests=1 to run these tests without touching saved sessions. */
if (new URLSearchParams(location.search).get('tests') === '1') {
  const results = [];
  function test(name,check) {
    try {
      if (!check()) throw new Error('Resultado inesperado');
      results.push({name,passed:true});
    } catch (error) {results.push({name,passed:false,error:error.message});}
  }
  test('Interpreta coma y punto decimal en céntimos', () =>
    Domain.parseMinor('12,30',2) === 1230 && Domain.parseMinor('0.01',2) === 1);
  test('Rechaza notación exponencial, negativos y precisión excesiva', () =>
    ['1e2','-5','1,001','1.200,00','12,'].every(text => Domain.parseMinor(text,2) === null));
  test('Respeta el límite de enteros seguros', () =>
    Domain.parseMinor('90071992547409,91',2) === Number.MAX_SAFE_INTEGER &&
    Domain.parseMinor('90071992547409,92',2) === null);
  test('Admite monedas de cero y tres decimales', () =>
    Domain.currencyDigits('JPY') === 0 && Domain.currencyDigits('KWD') === 3 &&
    Domain.parseMinor('81',0) === 81 && Domain.parseMinor('81,3',0) === null &&
    Domain.parseMinor('81,302',3) === 81302);
  test('Divide exactamente y asigna un residuo estable por comprador', () => {
    const parts = Domain.split(100,['c','b','a','a']);
    return parts.size === 3 && parts.get('a') === 34n && parts.get('b') === 33n && parts.get('c') === 33n
      && Domain.split(2,['x']).get('x') === 2n && Domain.split(2,[]).size === 0;
  });
  test('Conserva el total al dividir uno o muchos céntimos', () =>
    [1,2,9,100,Number.MAX_SAFE_INTEGER].every(amount => {
      const values = [...Domain.split(amount,['e','d','c','b','a']).values()];
      return values.reduce((sum,part) => sum + part,0n) === BigInt(amount)
        && values[0] - values.at(-1) <= 1n;
    }));
  test('Aplica alertas al 80 % y al 100 % exactos', () =>
    Domain.budgetStatus(10000,7999n).warning === '' &&
    Domain.budgetStatus(10000,8000n).warning === 'warn' &&
    Domain.budgetStatus(10000,9999n).warning === 'warn' &&
    Domain.budgetStatus(10000,10000n).warning === 'danger');
  test('Muestra saldo negativo y maneja presupuesto cero', () =>
    Domain.budgetStatus(100,150n).remaining === -50n &&
    Domain.budgetStatus(0,0n).warning === '' &&
    Domain.budgetStatus(0,1n).warning === 'danger' &&
    Domain.budgetStatus(0,1n).percent === null);
  test('Recalcula al agregar, editar, eliminar y restaurar', () => {
    const session = {people:[{id:'a',budget:100},{id:'b',budget:200}],expenses:[]};
    const expense = {amount:35,buyers:['b','a']};
    session.expenses.push(expense);
    if (Domain.totals(session).people.get('a') !== 18n) return false;
    expense.amount = 54;
    if (Domain.totals(session).people.get('a') !== 27n) return false;
    const removed = session.expenses.pop();
    if (Domain.totals(session).spent !== 0n) return false;
    session.expenses.push(removed);
    const totals = Domain.totals(session);
    return totals.spent === 54n && totals.budget === 300n && totals.people.get('b') === 27n;
  });
  test('Suma montos que exceden el rango seguro sin perder céntimos', () => {
    const session = {people:[{id:'a',budget:0}],expenses:[
      {amount:Number.MAX_SAFE_INTEGER,buyers:['a']},{amount:2,buyers:['a']}
    ]};
    return Domain.totals(session).people.get('a') === 9007199254740993n;
  });
  test('Agrupa lugares con cambios de mayúsculas o espacios', () =>
    Domain.placeKey('  Plaza   Real ') === Domain.placeKey('PLAZA REAL'));
  test('Conserva importes negativos de menos de una unidad al formatear', () =>
    money(-1n,'CRC').includes('-') && money(-1n,'CRC').includes('01'));
  const passed = results.filter(result => result.passed).length;
  const panel = document.createElement('section');
  panel.id = 'test-results';
  panel.dataset.passed = String(passed);
  panel.dataset.total = String(results.length);
  panel.className = 'empty';
  panel.innerHTML = '<h1>Pruebas de Gasto Claro</h1><p>' + passed + ' de ' + results.length +
    ' aprobadas</p><ul>' + results.map(result => '<li>' + (result.passed ? '✓ ' : '✗ ') +
    escape(result.name) + (result.error ? ' · ' + escape(result.error) : '') + '</li>').join('') + '</ul>';
  app.replaceChildren(panel);
}
</script>
